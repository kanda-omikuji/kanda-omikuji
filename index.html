<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神田神社 開運おみくじ</title>
<style>
:root{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;color:#392d23;background:#faf7ef}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:560px;margin:auto;min-height:100dvh;padding:28px 18px 36px;text-align:center;background:linear-gradient(#fffdf7,#f6edda);overflow:hidden}
.crest{font-size:46px;margin:16px 0 8px}
.sub{font-size:15px;letter-spacing:.2em;color:#75604a}
.title{font-size:clamp(29px,8vw,40px);margin:16px 0;color:#78372d;letter-spacing:.08em}
.intro{line-height:2;margin:26px 0}
button{font:700 21px 'Yu Gothic',sans-serif;border:0;border-radius:40px;background:#8e4237;color:white;padding:17px 35px;min-height:60px;cursor:pointer;box-shadow:0 5px 0 #602d27}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #602d27}
button:focus-visible{outline:3px solid #c5a45e;outline-offset:4px}
.result{width:100%;height:auto;display:block;border:1px solid #e9e0d1;border-radius:6px;margin:16px auto 24px}
#result{position:relative;z-index:21}
.hidden{display:none!important}
.note{font-size:13px;color:#786f64;margin-top:28px}
.again{margin:8px 0 16px}
.line{width:70px;height:2px;background:#b7a17a;margin:20px auto}
.opening-message{font-size:19px;line-height:1.9;color:#71532b;margin:26px auto 12px;letter-spacing:.06em}
.gold-note{font-size:16px;font-weight:bold;color:#9a742b;line-height:1.7;margin:24px 0}
.ornament{color:#ad8a4d;font-size:24px;letter-spacing:.4em;margin:8px 0}
.waiting-scene{position:relative;min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column;isolation:isolate}
.waiting-scene::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(211,173,86,.43) 0%,rgba(211,173,86,.15) 35%,rgba(211,173,86,0) 72%);animation:softGlow 1.8s ease-in-out infinite alternate;z-index:-1}
.waiting-symbol{font-size:78px;color:#b69a5a;animation:float 1.2s ease-in-out infinite alternate,shine 2s ease-in-out infinite alternate;text-shadow:0 0 20px #e5c77d}
.loading{padding:12px 0;font-size:19px;letter-spacing:.12em;color:#6f5639}
 .waiting-scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 16% 20%,#d6b453 0 3px,transparent 4px),radial-gradient(circle at 80% 22%,#d6b453 0 4px,transparent 5px),radial-gradient(circle at 25% 70%,#d6b453 0 3px,transparent 4px),radial-gradient(circle at 72% 76%,#d6b453 0 3px,transparent 4px),radial-gradient(circle at 50% 12%,#d6b453 0 3px,transparent 4px),radial-gradient(circle at 91% 56%,#d6b453 0 3px,transparent 4px);animation:sparkle 1.3s ease-in-out infinite alternate}
.waiting-symbol::before{content:"✦";position:absolute;font-size:24px;transform:translate(-35px,-15px);color:#d5a83e}
.waiting-symbol::after{content:"✧";position:absolute;font-size:29px;transform:translate(15px,28px);color:#d5a83e}
.reveal{animation:revealFortune 1.5s cubic-bezier(.2,.8,.25,1) both}
.result-glow{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle,rgba(255,231,147,.82) 0%,rgba(245,197,87,.25) 35%,transparent 75%);animation:flash 1.3s ease-out both}
@keyframes flash{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes sparkle{from{opacity:.25;transform:scale(.85) rotate(-8deg)}to{opacity:1;transform:scale(1.08) rotate(8deg)}}
@keyframes shine{from{filter:brightness(.8)}to{filter:brightness(1.5)}}
body.show-result .crest,body.show-result .sub,body.show-result .title,body.show-result .line{display:none}
body.show-result .wrap{padding-top:12px}
@keyframes softGlow{from{transform:scale(.8);opacity:.55}to{transform:scale(1.25);opacity:1}}
@keyframes float{from{transform:translateY(5px)}to{transform:translateY(-8px)}}
@keyframes revealFortune{from{opacity:0;transform:translateY(12px) scale(.7);filter:brightness(1.7)}to{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.waiting-scene::before,.waiting-scene::after,.waiting-symbol,.reveal,.result-glow{animation:none}}

/* 中央から四方八方へ伸びる金色の光線 */
.ray-burst{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;display:grid;place-items:center;animation:burstFade 3.6s ease-out both}
.ray-core{position:absolute;left:50%;top:50%;width:36vmin;height:36vmin;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fffef0 0%,#ffe4a0 18%,rgba(244,190,66,.6) 36%,transparent 70%);animation:corePulse 3.3s ease-out both}
.ray{position:absolute;left:50%;top:50%;height:clamp(3px,.9vmin,8px);width:85vmax;transform-origin:left center;transform:rotate(var(--angle)) scaleX(0);border-radius:100%;background:linear-gradient(90deg,rgba(255,255,238,.98),rgba(255,225,126,.93) 20%,rgba(229,165,48,.5) 58%,transparent 100%);box-shadow:0 0 12px 2px rgba(244,194,72,.65);animation:rayShoot 3.2s cubic-bezier(.15,.55,.3,1) both;animation-delay:var(--delay)}
.ray:nth-child(3n){height:3px;opacity:.72}.ray:nth-child(4n){height:7px;filter:brightness(1.2)}
@keyframes rayShoot{0%{transform:rotate(var(--angle)) scaleX(0);opacity:0}12%{opacity:1}75%{transform:rotate(var(--angle)) scaleX(1);opacity:1}100%{transform:rotate(var(--angle)) scaleX(1.08);opacity:0}}
@keyframes burstFade{0%,63%{opacity:1}100%{opacity:0}}
@keyframes corePulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
@media(prefers-reduced-motion:reduce){.ray-burst{display:none}}
</style>
</head>
<body>
<main class="wrap">
<div class="crest">⛩️</div>
<div class="sub">神田神社奉賛会</div>
<h1 class="title">開運おみくじ</h1>
<div class="line"></div>
<section id="start">
<p class="opening-message">今日のあなたに届く、<br>四文字の福。</p>
<div class="ornament" aria-hidden="true">✧ ❀ ✧</div>
<p class="intro" style="font-size:18px;line-height:1.9">くじ餅から広がる小さな福。<br>心をこめて、おみくじをお開きください。</p>
<button id="draw">福をひらく</button>
<p class="gold-note">✧ 金色の開運おみくじが出たら幸運のしるし ✧</p>
<p class="note">おみくじは一度だけお引きいただけます。</p>
</section>
<section id="waiting" class="hidden" aria-live="polite">
<div class="waiting-scene"><p class="loading">本日の福をお届けします…</p></div>
</section>
<section id="result" class="hidden">
<img id="fortune" class="result" alt="おみくじの結果">
<button class="again" id="offer">おみくじを納める</button>
<p class="note">画像を長押しすると保存できる場合があります。</p>
</section>
<section id="error" class="hidden"><p class="intro">画像を読み込めませんでした。images_gif フォルダーのファイル名を確認してください。</p></section>
<section id="finished" class="hidden"><div class="crest" aria-hidden="true">⛩️</div><p class="intro">おみくじを納札（のうさつ）しました。</p><p class="intro">今日の福が、あなたに訪れますように。<br>ありがとうございました。</p><p class="note"><span style="font-size:24px;font-weight:bold;">この画面は閉じていただいて結構です。</span></p></section>
</main>
<script>
// 既存の25枚のGIF画像をそのまま使用します。
const fortunes=Array.from({length:25},(_,i)=>'images_gif/'+String(i+1).padStart(2,'0')+'.gif');
const start=document.getElementById('start');
const waiting=document.getElementById('waiting');
const result=document.getElementById('result');
const fortune=document.getElementById('fortune');
const error=document.getElementById('error');
let drawn=false;
document.getElementById('draw').addEventListener('click',()=>{
  if(drawn)return;
  drawn=true;
  start.classList.add('hidden');
  result.classList.add('hidden');
  waiting.classList.remove('hidden');
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const burst=document.createElement('div');
    burst.className='ray-burst';
    burst.setAttribute('aria-hidden','true');
    const core=document.createElement('div');core.className='ray-core';burst.appendChild(core);
    for(let i=0;i<24;i++){
      const ray=document.createElement('span');ray.className='ray';
      ray.style.setProperty('--angle',`${i*15}deg`);
      ray.style.setProperty('--delay',`${(i%4)*0.035}s`);
      burst.appendChild(ray);
    }
    document.body.appendChild(burst);
    setTimeout(()=>burst.remove(),3700);
  }
  const pick=fortunes[Math.floor(Math.random()*fortunes.length)];
  let failed=false;
  fortune.onerror=()=>{
    failed=true;
    waiting.classList.add('hidden');
    result.classList.add('hidden');
    error.classList.remove('hidden');
  };
  fortune.src=pick+'?v='+Date.now();
  setTimeout(()=>{
    if(failed)return;
    waiting.classList.add('hidden');
    result.classList.remove('hidden');
    result.classList.remove('reveal');
    void result.offsetWidth;
    result.classList.add('reveal');
    document.body.classList.add('show-result');
    window.scrollTo(0,0);
  },2450);
});
document.getElementById('offer').addEventListener('click',()=>{
  result.classList.add('hidden');
  document.getElementById('finished').classList.remove('hidden');
  document.body.classList.remove('show-result');
  fortune.removeAttribute('src');
  window.scrollTo(0,0);
});
</script>
</body>
</html>
