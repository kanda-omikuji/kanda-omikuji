<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神田神社 開運おみくじ</title><style>
:root{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;color:#392d23;background:#faf7ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;min-height:100dvh;padding:28px 18px 36px;text-align:center;background:linear-gradient(#fffdf7,#f6edda)}.crest{font-size:38px;margin:16px 0}.sub{font-size:15px;letter-spacing:.2em;color:#75604a}.title{font-size:clamp(29px,8vw,40px);margin:16px 0;color:#78372d;letter-spacing:.08em}.intro{line-height:2;margin:26px 0}button{font:700 21px 'Yu Gothic',sans-serif;border:0;border-radius:40px;background:#9c3834;color:white;padding:17px 35px;min-height:60px;cursor:pointer;box-shadow:0 5px 0 #6d2523}button:active{transform:translateY(3px);box-shadow:0 2px 0 #6d2523}.result{width:100%;height:auto;display:block;border:1px solid #e9e0d1;border-radius:6px;margin:16px auto 24px}.hidden{display:none}.loading{padding:80px 0;font-size:24px;letter-spacing:.12em}.note{font-size:13px;color:#786f64;margin-top:28px}.again{margin:8px 0 16px}.line{width:70px;height:2px;background:#b7a17a;margin:20px auto}body.show-result .crest,body.show-result .sub,body.show-result .title,body.show-result .line{display:none}body.show-result .wrap{padding-top:12px}
</style></head><body><main class="wrap"><div class="crest">⛩️</div><div class="sub">神田神社奉賛会</div><h1 class="title">開運おみくじ</h1><div class="line"></div><section id="start"><p class="intro">くじ餅から広がる小さな福。<br>心をこめて、おみくじを引いてください。</p><button id="draw">おみくじを引く</button><p class="note">ご家族で何度でもお楽しみいただけます。</p></section><section id="waiting" class="hidden"><p class="loading" aria-live="polite">おみくじを引いています…</p></section><section id="result" class="hidden"><img id="fortune" class="result" alt="おみくじの結果"><button class="again" id="again">もう一度引く</button><p class="note">画像を長押しすると保存できる場合があります。</p></section></main><script>
// 画像を増やすときは images フォルダーに追加し、一覧にも追記します。
const fortunes=['images/01.png','images/02.png','images/03.png','images/04.png','images/05.png','images/06.png','images/07.png','images/08.png','images/09.png','images/10.png','images/11.png'];
const start=document.getElementById('start'),waiting=document.getElementById('waiting'),result=document.getElementById('result'),fortune=document.getElementById('fortune');
document.getElementById('draw').addEventListener('click',()=>{start.classList.add('hidden');result.classList.add('hidden');waiting.classList.remove('hidden');const pick=fortunes[Math.floor(Math.random()*fortunes.length)];fortune.onload=()=>{};fortune.src=pick;setTimeout(()=>{waiting.classList.add('hidden');result.classList.remove('hidden');document.body.classList.add('show-result');window.scrollTo(0,0);},1500)});
document.getElementById('again').addEventListener('click',()=>{result.classList.add('hidden');start.classList.remove('hidden');document.body.classList.remove('show-result');window.scrollTo(0,0)});
</script></body></html>
